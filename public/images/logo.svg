<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8b84f8"/>
      <stop offset="50%"  stop-color="#7B74F0"/>
      <stop offset="100%" stop-color="#5b4fd4"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.30)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.00)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3d35b8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fond circulaire principal -->
  <circle cx="160" cy="160" r="152" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Reflet lumière haut -->
  <ellipse cx="160" cy="100" rx="90" ry="55" fill="url(#shineGrad)"/>

  <!-- Bordure subtile -->
  <circle cx="160" cy="160" r="152" fill="none"
          stroke="rgba(255,255,255,0.20)" stroke-width="2.5"/>

  <!-- ── ICÔNE CHAPEAU DE DIPLÔMÉ ── -->
  <!-- Plateau principal -->
  <path d="M160 72 L68 120 L160 168 L252 120 Z"
        fill="white" opacity="0.97"/>

  <!-- Calotte / dessous du chapeau -->
  <path d="M108 136 L108 178
           Q160 204 212 178
           L212 136
           L160 158 Z"
        fill="white" opacity="0.82"/>

  <!-- Trait séparateur calotte -->
  <line x1="108" y1="136" x2="212" y2="136"
        stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>

  <!-- Corde du chapeau -->
  <line x1="252" y1="120" x2="252" y2="158"
        stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.90"/>
  <circle cx="252" cy="164" r="7" fill="white" opacity="0.88"/>

  <!-- Étoile dorée sur le dessus -->
  <path d="M160 92
           L165 108 L182 108
           L168 118 L173 134
           L160 125 L147 134
           L152 118 L138 108
           L155 108 Z"
        fill="#fbbf24" opacity="0.95"/>
  <path d="M160 92
           L165 108 L182 108
           L168 118 L173 134
           L160 125 L147 134
           L152 118 L138 108
           L155 108 Z"
        fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Livre ouvert en bas à gauche -->
  <g transform="translate(58,188)" opacity="0.85">
    <path d="M0 0 L0 52 Q24 44 48 52 L48 0 Q24 8 0 0 Z"
          fill="rgba(255,255,255,0.90)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="24" y1="0" x2="24" y2="52"
          stroke="rgba(123,116,240,0.6)" stroke-width="1.5"/>
    <line x1="6"  y1="14" x2="22" y2="14"
          stroke="rgba(123,116,240,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6"  y1="22" x2="22" y2="22"
          stroke="rgba(123,116,240,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6"  y1="30" x2="18" y2="30"
          stroke="rgba(123,116,240,0.35)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="14" x2="42" y2="14"
          stroke="rgba(123,116,240,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="22" x2="42" y2="22"
          stroke="rgba(123,116,240,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="30" x2="38" y2="30"
          stroke="rgba(123,116,240,0.35)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Stylo / crayon en bas à droite -->
  <g transform="translate(214,190) rotate(-30)" opacity="0.85">
    <rect x="0" y="0" width="12" height="52" rx="3" fill="white" opacity="0.90"/>
    <polygon points="0,52 12,52 6,66" fill="rgba(255,255,255,0.80)"/>
    <rect x="0" y="0" width="12" height="8" rx="3"
          fill="#fbbf24" opacity="0.90"/>
    <rect x="2" y="10" width="8" height="2" rx="1"
          fill="rgba(123,116,240,0.5)"/>
    <rect x="2" y="16" width="8" height="2" rx="1"
          fill="rgba(123,116,240,0.4)"/>
  </g>

  <!-- Texte SMS en bas -->
  <text x="160" y="262"
        text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800"
        font-size="34"
        fill="white"
        opacity="0.97"
        letter-spacing="5">SMS</text>

  <!-- Trait décoratif sous SMS -->
  <rect x="112" y="270" width="96" height="3" rx="1.5"
        fill="rgba(255,255,255,0.40)"/>

  <!-- "School Mgmt" micro-texte -->
  <text x="160" y="291"
        text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-weight="500"
        font-size="14"
        fill="rgba(255,255,255,0.70)"
        letter-spacing="1">School Management</text>
</svg>
