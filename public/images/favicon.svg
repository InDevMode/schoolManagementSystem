<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8b84f8"/>
      <stop offset="100%" stop-color="#5b4fd4"/>
    </linearGradient>
  </defs>

  <!-- Fond carré arrondi -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#fbg)"/>
  <!-- Reflet -->
  <rect x="1" y="1" width="62" height="30" rx="15"
        fill="rgba(255,255,255,0.14)"/>
  <!-- Bordure subtile -->
  <rect x="1" y="1" width="62" height="62" rx="15"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Chapeau de diplômé simplifié -->
  <!-- Plateau -->
  <path d="M32 13 L9 25 L32 37 L55 25 Z"
        fill="white" opacity="0.95"/>
  <!-- Calotte -->
  <path d="M19 30 L19 42 Q32 48 45 42 L45 30 L32 36 Z"
        fill="white" opacity="0.80"/>
  <!-- Corde -->
  <line x1="55" y1="25" x2="55" y2="36"
        stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.88"/>
  <circle cx="55" cy="38" r="3" fill="white" opacity="0.88"/>

  <!-- Étoile dorée -->
  <path d="M32 18 L33.6 23 L39 23 L34.7 26.2 L36.3 31.2 L32 28.2 L27.7 31.2 L29.3 26.2 L25 23 L30.4 23 Z"
        fill="#fbbf24" opacity="0.95"/>

  <!-- Texte S en bas -->
  <text x="32" y="57"
        text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-weight="800"
        font-size="13"
        fill="rgba(255,255,255,0.85)"
        letter-spacing="1">SMS</text>
</svg>
