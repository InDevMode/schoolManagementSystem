[phases.setup]
nixPkgs = [
  'php83',
  'php83Extensions.pdo',
  'php83Extensions.pdo_pgsql',
  'php83Extensions.pgsql',
  'php83Extensions.mbstring',
  'php83Extensions.xml',
  'php83Extensions.curl',
  'php83Extensions.zip',
  'php83Extensions.gd',
  'php83Extensions.bcmath',
  'php83Extensions.intl',
  'php83Extensions.tokenizer',
  'php83Extensions.fileinfo',
  'php83Extensions.openssl',
  'php83Extensions.ctype',
  'php83Extensions.json',
  'php83Extensions.redis',
  'composer',
  'nodejs_20',
  'nodePackages.npm'
]

[phases.install]
cmds = [
  'composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist',
  'npm ci --prefer-offline',
  'npm run build'
]

[phases.build]
cmds = [
  'mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache',
  'chmod -R 775 storage bootstrap/cache',
  'php artisan config:cache',
  'php artisan route:cache',
  'php artisan view:cache'
]

[start]
cmd = 'php artisan migrate --force && php artisan storage:link --force 2>/dev/null || true && php -S 0.0.0.0:$PORT -t public'
